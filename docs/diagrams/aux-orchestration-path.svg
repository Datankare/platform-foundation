<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 500" role="img" font-family="sans-serif">
  <title>AUX orchestration path: one full-pipeline call runs the same three steps server-side</title>
  <desc>The agent makes a single full-pipeline call. The PF-B workflow layer runs identify, translate and speak internally as a server-side loop, applying the same gates and appending to the same trajectory, then returns the final result with the complete nextActions. It is the same workflow definition as the choreography path, run to completion rather than across round trips.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="150" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="110" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Agent</text>
  <text x="110" y="192" text-anchor="middle" font-size="12" fill="#534AB7">one call</text>

  <rect x="240" y="60" width="400" height="240" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="440" y="88" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">PF-B · full-pipeline</text>
  <text x="440" y="106" text-anchor="middle" font-size="12" fill="#185FA5">server-side loop over the same steps</text>

  <rect x="290" y="130" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="360" y="156" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">identify</text>
  <rect x="290" y="196" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="360" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">translate</text>
  <rect x="450" y="196" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="520" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">speak</text>

  <line x1="360" y1="174" x2="360" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="218" x2="448" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="180" y1="178" x2="238" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="209" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">goal</text>

  <rect x="240" y="330" width="400" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="440" y="354" text-anchor="middle" font-size="12" fill="#633806">result + full trajectory + nextActions + cost</text>
  <text x="440" y="372" text-anchor="middle" font-size="12" fill="#633806">hands control back with affordances — never dead-ends</text>

  <path d="M440 300 L440 328" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M240 358 L110 358 L110 208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="420" width="600" height="60" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="442" text-anchor="middle" font-size="12" fill="#444441">Same gates per step as the choreography path — no shortcut that skips risk, budget or safety</text>
  <text x="340" y="462" text-anchor="middle" font-size="12" fill="#444441">The trajectory is identical either way — auditability does not depend on which door the agent used</text>
</svg>
