# Sync from Platform Foundation — TEMPLATE for a consuming app (TASK-160)
#
# Copy to .github/workflows/sync-from-foundation.yml in your app, with .github/sync-config.json
# (docs/templates/sync-config.json). platform-foundation's own __tests__/workflow-hygiene.test.ts
# runs in your repository over your workflows and your sync-config, and this template passes it:
#
#   - No `${{ … }}` inside a `run:` script (audit H-9). An input, a ref, a step output built from
#     them is shell-interpolated before the script runs — command injection. Every value a script
#     uses comes in through the step's `env:` and is quoted ("$SOURCE_REF").
#   - Every exclude in sync-config.json is anchored (H-3): `/package.json`, `platform/x/**`, never
#     a bare `package.json`, which matches at any depth.
#
# The rsync runs WITHOUT --delete by design: files the platform removes are removed by hand
# (docs/SETUP_AND_INTEGRATION.md §6). After it, your app's own module manifest
# (platform/modules/app-manifest.json, sync-excluded) needs no step: scripts/module-manifest.cjs
# merges it with the platform's on every read (TASK-157).

name: Sync from Platform Foundation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Override source ref (tag, branch, or "latest")'
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          path: target

      - name: Read sync config
        id: config
        env:
          REF_OVERRIDE: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          SOURCE=$(jq -r '.source' target/.github/sync-config.json)
          REF_CONFIG=$(jq -r '.source_ref' target/.github/sync-config.json)
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "source_ref=${REF_OVERRIDE:-$REF_CONFIG}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.config.outputs.source }}
          REF: ${{ steps.config.outputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "$REF" = "latest" ]; then
            REF=$(gh api "repos/$SOURCE/releases/latest" --jq '.tag_name')
          fi
          echo "resolved_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using ref: $REF"

      - name: Checkout platform-foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Expressions in `with:` are not shell: they are safe here.
          repository: ${{ steps.config.outputs.source }}
          ref: ${{ steps.resolve.outputs.resolved_ref }}
          token: ${{ github.token }}
          path: source
          persist-credentials: false

      - name: Version guard
        # An app may adopt the platform from develop ahead of its release: never sync an older or
        # equal platform over a newer one (that pull request would revert work). Copy
        # docs/templates/sync-version-guard.sh to .github/scripts/ in the app.
        id: guard
        run: bash target/.github/scripts/sync-version-guard.sh source target >> "$GITHUB_OUTPUT"
      - name: Sync files
        if: steps.guard.outputs.proceed == 'true'
        id: sync
        env:
          RESOLVED_REF: ${{ steps.resolve.outputs.resolved_ref }}
        run: |
          set -euo pipefail
          SHA=$(git -C source rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          EXCLUDES=(--exclude=.git --exclude=node_modules)
          while IFS= read -r pattern; do
            EXCLUDES+=("--exclude=$pattern")
          done < <(jq -r '.exclude[]' target/.github/sync-config.json)
          rsync -a --checksum "${EXCLUDES[@]}" source/ target/
          echo "Synced $RESOLVED_REF @ $SHA"

      - name: Open the pull request
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FOUNDATION_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ steps.config.outputs.source }}
          REF: ${{ steps.resolve.outputs.resolved_ref }}
          SHA: ${{ steps.sync.outputs.sha }}
        # One sync pull request at a time (TASK-200): a run whose platform sha already has an open
        # sync pull request opens nothing; a new one closes every older one (REST only: gh api).
        run: |
          set -euo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          cd target
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Up to date with $SOURCE $REF @ $SHA" | tee -a "$SUMMARY"
            exit 0
          fi
          OPEN=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("auto-sync/")) | [.number, .head.ref, .title] | @tsv')
          SHORT="${SHA:0:7}"
          while IFS=$'\t' read -r NUM HEAD TITLE; do
            [ -n "$NUM" ] || continue
            if [[ "$TITLE" =~ @\ ${SHORT}[0-9a-f]*$ ]]; then
              echo "Sync pull request #$NUM is already open for $SOURCE @ $SHORT: nothing new opened" | tee -a "$SUMMARY"
              exit 0
            fi
          done <<< "$OPEN"
          BRANCH="auto-sync/foundation-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          # The full sha in the subject and the title (TASK-200): the process check exempts a sync by
          # this subject alone, and verifies nothing else — so the commit holds the rsync's output only.
          git commit -m "chore(sync): inherit platform-foundation $REF @ $SHA"
          git push origin "$BRANCH"
          URL=$(gh pr create --base develop --head "$BRANCH" \
            --title "chore(sync): inherit platform-foundation $REF @ $SHA" \
            --body "Automated pull from \`$SOURCE@$SHA\` (ref \`$REF\`). No --delete: remove the files the platform deleted by hand and amend the deletions into the sync commit (or push them as a chore(sync) commit of deletions only, naming the same sha). Never amend the app's own change into it: the process check exempts a sync by its subject alone. Run every gate before merging.")
          NEW="${URL##*/}"
          echo "Opened sync pull request #$NEW for $SOURCE $REF @ $SHORT" | tee -a "$SUMMARY"
          # Every older sync pull request is superseded: closed with a comment, its branch deleted.
          while IFS=$'\t' read -r NUM HEAD TITLE; do
            [ -n "$NUM" ] && [ "$NUM" != "$NEW" ] || continue
            gh api -X POST "repos/$GH_REPO/issues/$NUM/comments" -f body="Superseded by #$NEW." >/dev/null
            gh api -X PATCH "repos/$GH_REPO/pulls/$NUM" -f state=closed >/dev/null
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$HEAD" >/dev/null || echo "Branch $HEAD already gone"
            echo "Closed #$NUM ($HEAD): superseded by #$NEW" | tee -a "$SUMMARY"
          done <<< "$OPEN"
