name: "Semgrep SAST"

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Results go to the repository's code scanning (free for public repositories). The upload
      # was removed while the repository was private (it needed paid Code Security); restored once
      # public, so findings appear under Security and the stale "Semgrep OSS" tool status clears.
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        # Pinned (audit H-12): an unpinned scanner changes its rules under the build without a
        # commit. Raise it deliberately, with the findings of the new version triaged.
        run: pip install semgrep==1.182.0

      - name: Run Semgrep
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --error .

      - name: Run Semgrep (SARIF for code scanning)
        if: always()
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --sarif --output semgrep.sarif . || true

      - name: Upload to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
