name: "Semgrep SAST"

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Results go to the repository's code scanning (free for public repositories). The upload
      # was removed while the repository was private (it needed paid Code Security); restored once
      # public, so findings appear under Security and the stale "Semgrep OSS" tool status clears.
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        # Pinned (audit H-12): an unpinned scanner changes its rules under the build without a
        # commit. Raise it deliberately, with the findings of the new version triaged. PyYAML is
        # for scripts/semgrep-rules.py.
        run: pip install semgrep==1.182.0 pyyaml==6.0.3

      # TASK-204 (N-9): the rules are pinned too. The registry packs (p/owasp-top-ten,
      # p/typescript) were downloaded on every run, so the blocking rules changed without a commit.
      # They now come from semgrep-rules at the commit in .semgrep/rules.json, selected by
      # scripts/semgrep-rules.py; nothing is downloaded from the registry (--metrics=off).
      - name: The pinned rules
        run: |
          set -euo pipefail
          repo=$(jq -r '.repository' .semgrep/rules.json)
          commit=$(jq -r '.commit' .semgrep/rules.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.semgrep/rules.json: commit is not a 40-hex sha"; exit 1; }
          git init -q "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" fetch -q --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout -q FETCH_HEAD
          python3 scripts/semgrep-rules.py "$RUNNER_TEMP/semgrep-rules" "$RUNNER_TEMP/semgrep-rules.yml"

      - name: Run Semgrep
        run: semgrep scan --metrics=off --config "$RUNNER_TEMP/semgrep-rules.yml" --error .

      - name: Run Semgrep (SARIF for code scanning)
        id: sarif
        if: always()
        run: |
          set -uo pipefail
          # Written to the runner's temp directory, never into the checkout (TASK-204, N-2).
          semgrep scan --metrics=off --config "$RUNNER_TEMP/semgrep-rules.yml" --sarif --output "$RUNNER_TEMP/semgrep.sarif" . || true
          if [ -s "$RUNNER_TEMP/semgrep.sarif" ]; then echo "written=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to code scanning
        if: always() && steps.sarif.outputs.written == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep
