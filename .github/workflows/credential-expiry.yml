name: Credential expiry

# TASK-197 (audit D-6): nothing recorded when a credential expires. docs/credential-register.json
# lists each credential this repository and its deployments hold (name, where it lives, when it
# expires — never a value), and scripts/check-credential-expiry.mjs fails this run when one expires
# within the register's leadDays (30; the repository variable CREDENTIAL_LEAD_DAYS overrides), or
# has expired. A failed scheduled run notifies; "unknown" only warns until the owner records it.
#
#   - Weekly, by hand, and on a pull request that changes the register or the check.
#   - Reads the repository only: no secret, no install, no build (Node's own JSON and dates).
#   - Least permissions: contents: read; the checkout keeps no credentials.

on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - docs/credential-register.json
      - scripts/check-credential-expiry.mjs

permissions: {}

concurrency:
  group: credential-expiry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expiry:
    name: expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: No credential expires within the lead time
        env:
          CREDENTIAL_LEAD_DAYS: ${{ vars.CREDENTIAL_LEAD_DAYS }}
        run: node scripts/check-credential-expiry.mjs
