name: "CodeQL SAST"

on:
  # On develop too, so a finding surfaces on the commit that introduces it rather than first at
  # promotion (7A: a doc-generator escaping finding appeared only on the develop → staging PR).
  push:
    branches: [develop]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Only the ReDoS test fixture file is excluded — it necessarily
          # contains unsafe regex patterns to verify safe-regex2 validation.
          # All other test files remain fully scanned by CodeQL.
          config: |
            paths-ignore:
              - '__tests__/moderation-blocklist-redos.test.ts'

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
