name: Model registry check

# TASK-186: every model in MODEL_REGISTRY (platform/ai/types.ts) still resolves on the Anthropic
# Models API, is not retired, and accepts the request the provider sends it (one max_tokens-1
# Messages call per tier, with the registry's thinking and temperature settings). Sonnet 4 was
# retired on 2026-06-15 and nothing noticed until calls failed (PR #461).
#
# TASK-197 (audit D-3): a deprecated model, or one whose retires_at is within
# MODEL_RETIRE_LEAD_DAYS (repository variable; default 30), fails the run — a failed scheduled run
# notifies, a warning did not. With the GOOGLE_API_KEY secret, the Google voices the platform
# names are checked against voices.list too, and (TASK-204, N-50) the speech-to-text model by one
# recognize call on silence; with OPENAI_API_KEY, the embedding models on OpenAI's models API.
# The deployed keys are checked at readiness (the ai-provider and google-tts probes), not here.
#
# TASK-197 (the 2026-10-28 incident: the security-review action sent the CI key to a retired
# model): every model a workflow names must be a MODEL_REGISTRY model, and a pinned action that
# hard-codes a retired model it lets nobody override (KNOWN_ACTION_MODELS in the script) is a loud
# warning and a summary line until the exception's review-by date, then fails this run — with or
# without the key, so it is seen, not silent, and cannot outlive its review.
#
#   - Weekly, by hand (workflow_dispatch), and on a pull request that changes the registry or the
#     check. Reads the repository only; no install, no build: scripts/check-model-ids.mjs uses
#     Node's own fetch. Costs a few tokens per tier per run.
#   - pull_request, never pull_request_target: a fork's (or Dependabot's) PR gets no secrets, so
#     it skips the probe with a notice and a step summary — and, once MODEL_CHECK_REQUIRED is
#     'true', fails instead. That is intended, as with the security review: a required check
#     never passes without having run.
#   - A skip is visible, and is a failure where it matters: with the repository variable
#     MODEL_CHECK_REQUIRED set to 'true', a run without the key fails (as SECURITY_REVIEW_REQUIRED
#     does for the security review). The variable reaches the shell through env.
#   - The key (ANTHROPIC_API_KEY secret) reaches the script through env and is sent only as a
#     header; the script prints no key and no response body, only HTTP statuses.
#   - Least permissions: contents: read, nothing else; the checkout keeps no credentials.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - platform/ai/types.ts
      - platform/voice/voices.ts
      - lib/tts.ts
      - scripts/check-model-ids.mjs
      - platform/voice/google-stt.ts
      - platform/rag/embedding-types.ts
      - .github/workflows/**

permissions: {}

concurrency:
  group: model-registry-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-ids:
    name: model-ids
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Every registry model ID resolves
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # TASK-204 (N-50): the embedding models, when this secret is set (skipped with a notice
          # otherwise: no deployment sets EMBEDDING_PROVIDER=openai yet).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_CHECK_REQUIRED: ${{ vars.MODEL_CHECK_REQUIRED }}
          MODEL_RETIRE_LEAD_DAYS: ${{ vars.MODEL_RETIRE_LEAD_DAYS }}
          # The action's file list (api.github.com) with the job's read-only token, not the
          # unauthenticated rate limit (TASK-197 review round 3, N5).
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-model-ids.mjs
