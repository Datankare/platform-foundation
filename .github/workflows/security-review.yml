name: Security review

# TASK-183 (docs/AI_ENGINEERING.md §4.3): a model reviews every pull request's diff for security
# issues; its findings are posted on the PR, and the check fails while it reports any.
#
#   - TASK-204 (N-86): our own step, scripts/security-review.mjs, replaces the
#     anthropics/claude-code-security-review action (pinned at 0c6a49f, no release tags), whose
#     API check hard-coded a retired model (claude_api_client.py:62) that no input could change —
#     so its false-positive filter was off, and the model check's exception for it expired on
#     2026-12-31. What it did is kept: the diff reviewed for security issues, the findings posted
#     on the PR (one comment, updated on each push), the check failing on any. Its prompt is
#     adapted from the action's (Anthropic, MIT; credited in AI_ENGINEERING §4.3); each finding is
#     checked by a second call (the action's filter, working again).
#   - The model is MODEL_REGISTRY's standard tier, read from platform/ai/types.ts by the script:
#     no workflow names a model, and the weekly model check covers it. No install: Node's own
#     fetch, no package installed at run time (the action installed Claude Code and Python
#     requirements unpinned).
#   - The diff is git's own, from the checkout (base...head): no PR is too large to fetch (the
#     action's 406). A diff past the script's bound fails the check, saying so — never a silent
#     pass, never "re-run": a repository admin reviews the diff by hand and, if satisfied, merges
#     with the ruleset's admin bypass, which GitHub records (TASK-197 review round 3, the owner's
#     decision; there is no in-workflow acknowledgement).
#   - pull_request, never pull_request_target: GitHub gives a fork's pull request no secrets and a
#     read-only token, so a fork can neither reach the key nor post as the repository. The review
#     also runs only when the PR's head is a branch of this repository: the diff is untrusted
#     input to a model (prompt injection), so only trusted branches are reviewed.
#   - A skipped review never reads as a passed one. It always writes a notice and a summary, and:
#       - a fork's PR fails (no review can run there);
#       - without the ANTHROPIC_API_KEY secret it passes, unless the repository variable
#         SECURITY_REVIEW_REQUIRED is 'true' — then it fails. Set the variable once the key is set.
#       - a Dependabot PR does not receive repository (Actions) secrets; it is treated as having
#         no key, so it fails when the review is required. A required check must not pass
#         without a review: the owner re-runs it after adding the key as a Dependabot secret, or
#         merges past it knowingly.
#     The variable reaches the shell through env, never as an expression inside run.
#   - Every push is reviewed again (synchronize), so a commit that fixes a finding clears the check.
#   - The results file goes to $RUNNER_TEMP, never into the checkout.

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
      SECURITY_REVIEW_REQUIRED: ${{ vars.SECURITY_REVIEW_REQUIRED }}
    steps:
      - name: Skip without the key, or for a fork
        if: env.HAS_KEY != 'true' || env.SAME_REPO != 'true'
        run: |
          set -u
          fail=0
          if [ "$SAME_REPO" != "true" ]; then
            why="the pull request comes from a fork, which is never given the key"
            fail=1
          elif [ "$IS_DEPENDABOT" = "true" ]; then
            why="Dependabot PRs do not receive repository secrets"
          else
            why="the ANTHROPIC_API_KEY secret is not set in this repository"
          fi
          if [ "$SECURITY_REVIEW_REQUIRED" = "true" ]; then
            fail=1
          fi
          echo "::notice::Security review skipped: $why."
          {
            echo "## Security review: skipped"
            echo
            echo "No scan ran: $why (required: ${SECURITY_REVIEW_REQUIRED:-unset}). See docs/AI_ENGINEERING.md §4.3."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Security review skipped, so this check fails: a skipped scan is not a passed one ($why)."
            exit 1
          fi

      - name: Checkout (no credentials)
        if: env.HAS_KEY == 'true' && env.SAME_REPO == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The base...head diff needs the merge base: the whole history (git, not the API).
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        if: env.HAS_KEY == 'true' && env.SAME_REPO == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Security review (scripts/security-review.mjs)
        if: env.HAS_KEY == 'true' && env.SAME_REPO == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          SECURITY_REVIEW_RESULTS="$RUNNER_TEMP/security-review-results.json" node scripts/security-review.mjs
