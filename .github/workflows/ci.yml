name: Continuous Confidence

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

# Least privilege (audit H-5): read the code, nothing else.
permissions:
  contents: read

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Layer 0d — Dependency audit (TASK-058)
      # Production deps are the real runtime attack surface — audited strictly, hard gate.
      # Dev-only deps (jest/eslint/babel toolchain) are audited informationally: npm audit
      # evaluates declared manifest ranges rather than the resolved tree, so it false-positives
      # on transitives that `overrides` has already patched (e.g. brace-expansion pinned to a
      # fixed version). `npm ls` confirms the patched version is what installs; this step keeps
      # visibility without blocking CI on a range-vs-resolution false positive.
      - name: Layer 0d — Dependency audit (production, hard gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Layer 0d — Dependency audit (dev, informational)
        run: npm audit --audit-level=high || true

      - name: Layer 0a — Type check
        run: npm run typecheck

      - name: Layer 0b — Lint
        run: npm run lint

      - name: Layer 0c — Format check
        run: npm run format:check

      - name: Layer 0e — Override audit (TASK-070)
        run: npm run overrides:audit

      - name: Install Postgres 17 + pgvector (apt.postgresql.org)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgvector >/dev/null
          # The runner image turns off automatic cluster creation (create_main_cluster = false),
          # so the package installs without one: create it when missing, start it if stopped.
          if ! pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main"' | grep -q .; then
            sudo pg_createcluster 17 main --start >/dev/null
          fi
          sudo pg_ctlcluster 17 main status >/dev/null || sudo pg_ctlcluster 17 main start
          # The runner image may already have another cluster on 5432; use whatever 17 got.
          port=$(pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main" { print $3 }')
          [ -n "$port" ] || { pg_lsclusters; echo "no Postgres 17 cluster"; exit 1; }
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -q -p "$port" \
            -c "ALTER USER postgres PASSWORD 'postgres'" -c "CREATE DATABASE replay"
          echo "Postgres $(sudo -u postgres psql -X -At -p "$port" -c 'show server_version') on port $port"

      # Review 9 M5: the Valkey cache provider's suites spawn a TLS server of their own
      # (__tests__/helpers/valkey-server.ts); REQUIRE_VALKEY_TESTS makes its absence a failure.
      - name: Install Valkey/Redis server (the Valkey cache tests)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq redis-server >/dev/null
          redis-server --version

      # ADR-053 D8: the suites under __tests__/db (platform/data, every Postgres store, the
      # tenant isolation kit) run against a database built by the migration replay, signed in as
      # app_tenant (a throwaway password, this job only) and as the owner. REQUIRE_DB_TESTS makes a
      # missing database a failure, so this layer can never pass by skipping them.
      - name: Layer 1 — Database for the data-layer tests (migration replay)
        run: |
          set -euo pipefail
          bash scripts/migration-replay.sh
          pw="ci-$(openssl rand -hex 16)"
          psql -X -q -v ON_ERROR_STOP=1 -c "ALTER ROLE app_tenant LOGIN PASSWORD '$pw'"
          echo "::add-mask::$pw"
          echo "TEST_DATABASE_URL=postgresql://app_tenant:$pw@localhost:$PGPORT/replay" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_OWNER_URL=postgresql://postgres:postgres@localhost:$PGPORT/replay" >> "$GITHUB_ENV"
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: replay

      - name: Layer 1 — Unit tests
        run: npm run test:coverage
        env:
          REQUIRE_DB_TESTS: "1"
          REQUIRE_VALKEY_TESTS: "1"

      # ADR-054 §4: the core's own tests, run as an app with no product module registered — what a
      # consumer that opts into none inherits and must pass. Module tests and the app's own
      # module-list tests are left out (jest.core.config.cjs, from platform/modules/manifest.json).
      - name: Layer 1 — Core without modules (ADR-054)
        run: npm run test:core
        env:
          REQUIRE_DB_TESTS: "1"

      # TASK-159: a 30-day purge check failed under TZ=America/New_York across a DST change. The
      # suite runs again in a zone with DST, and the database suites with the session's time zone
      # set there too (per connection — the data layer must make every transaction UTC itself).
      - name: Layer 1 — Unit tests in another time zone (TASK-159)
        run: |
          set -euo pipefail
          tz="options=-c%20TimeZone%3DAmerica%2FNew_York"
          TEST_DATABASE_URL="$TEST_DATABASE_URL?$tz" \
            TEST_DATABASE_OWNER_URL="$TEST_DATABASE_OWNER_URL?$tz" \
            npx jest --silent
        env:
          TZ: America/New_York
          REQUIRE_DB_TESTS: "1"
          REQUIRE_VALKEY_TESTS: "1"

      - name: Layer 1b — Coverage ratchet (TASK-080)
        run: npm run coverage:ratchet

      - name: Layer 2 — Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  # Layer 1c — Migration replay (TASK-091)
  # Builds a database from zero the way a new instance is built — Supabase shim, schema
  # baseline, then every migration the baseline does not cover — on Postgres 17 with pgvector,
  # and fails on any SQL error, a missing table or function, or a table without row-level
  # security. Nothing else in CI executes migration SQL (Gotcha 100).
  migration-replay:
    name: Migration replay
    runs-on: ubuntu-latest
    # Postgres 17 + pgvector from the PostgreSQL project's own apt repository, on the runner —
    # not a Docker Hub image: anonymous pulls are rate-limited, and the limit failed this job
    # twice in a row on 2026-10-09 with nothing wrong in the code (TASK-122).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Postgres 17 + pgvector (apt.postgresql.org)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgvector >/dev/null
          # The runner image turns off automatic cluster creation (create_main_cluster = false),
          # so the package installs without one: create it when missing, start it if stopped.
          if ! pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main"' | grep -q .; then
            sudo pg_createcluster 17 main --start >/dev/null
          fi
          sudo pg_ctlcluster 17 main status >/dev/null || sudo pg_ctlcluster 17 main start
          # The runner image may already have another cluster on 5432; use whatever 17 got.
          port=$(pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main" { print $3 }')
          [ -n "$port" ] || { pg_lsclusters; echo "no Postgres 17 cluster"; exit 1; }
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -q -p "$port" \
            -c "ALTER USER postgres PASSWORD 'postgres'" -c "CREATE DATABASE replay"
          echo "Postgres $(sudo -u postgres psql -X -At -p "$port" -c 'show server_version') on port $port"

      - name: Replay baseline and every migration it does not record
        run: bash scripts/migration-replay.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: replay

  # Layer 2b — The container image (ADR-055 D1/D5, TASK-128)
  # Builds the image from this commit with the repository's Dockerfile, runs it read-only as its
  # non-root user against Postgres built by the migration replay, waits until /api/health/ready
  # says ready, runs the deploy smoke test against it, runs the job worker once from the same
  # image, and stops it with SIGTERM: readiness must flip while liveness answers, and the process
  # must exit 0 within its bound. Postgres comes from apt, not a Docker Hub image (TASK-122); the
  # Node base image is pulled with retries and Google's Docker Hub mirror as a fallback.
  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: platform-foundation:ci
      PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Postgres 17 + pgvector (apt.postgresql.org)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgvector >/dev/null
          if ! pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main"' | grep -q .; then
            sudo pg_createcluster 17 main --start >/dev/null
          fi
          sudo pg_ctlcluster 17 main status >/dev/null || sudo pg_ctlcluster 17 main start
          port=$(pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main" { print $3 }')
          [ -n "$port" ] || { pg_lsclusters; echo "no Postgres 17 cluster"; exit 1; }
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -q -p "$port" \
            -c "ALTER USER postgres PASSWORD 'postgres'" -c "CREATE DATABASE replay"

      - name: Database (migration replay) and the run's settings
        run: |
          set -euo pipefail
          bash scripts/migration-replay.sh
          pw="ci-$(openssl rand -hex 16)"
          cron="$(openssl rand -hex 32)"
          guest="$(openssl rand -base64 48 | tr -d '\n')"
          erasure="$(openssl rand -hex 32)"
          refreshkey="$(openssl rand -hex 32)"
          # Throwaway values for this job's database and app. They are never printed: they go
          # only into an env file (umask 077) passed to the containers with --env-file — not into
          # $GITHUB_ENV, whose values each later step's log header shows.
          psql -X -q -v ON_ERROR_STOP=1 -c "ALTER ROLE app_tenant LOGIN PASSWORD '$pw'"
          # The image runs as a CI run (DEPLOYMENT_HOST=ci: plaintext to the local database and
          # the mock sign-in are allowed), with every durable store on Postgres.
          umask 077
          {
            echo "DEPLOYMENT_HOST=ci"
            echo "PORT=$PORT"
            echo "AUTH_PROVIDER=mock"
            echo "E2E_TEST_DOUBLE_AUTH=true"
            echo "AI_PROVIDER=mock"
            echo "GUEST_TOKEN_SECRET=$guest"
            echo "ERASURE_HASH_KEY=$erasure"
            echo "REFRESH_COOKIE_KEY=$refreshkey"
            echo "CRON_SECRET=$cron"
            echo "CACHE_PROVIDER=memory"
            echo "TENANCY_MODE=single"
            echo "TENANT_ID=00000000-0000-4000-8000-000000000001"
            echo "DATABASE_URL=postgresql://app_tenant:$pw@localhost:$PGPORT/replay"
            echo "DATABASE_OWNER_URL=postgresql://postgres:postgres@localhost:$PGPORT/replay"
            echo "DATABASE_SSL=disable"
            for store in MODERATION_STORE STRIKE_STORE REVIEW_QUEUE_STORE APP_STATE_STORE \
              TRAJECTORY_STORE BUDGET_STORE PROPOSAL_STORE EFFECT_LEDGER APPROVAL_POLICY_STORE \
              GUEST_USAGE_STORE RATE_LIMIT_STORE JOB_STORE SOCIAL_STORE; do
              echo "$store=postgres"
            done
            echo "SHUTDOWN_DRAIN_SECONDS=5"
            echo "SHUTDOWN_TIMEOUT_SECONDS=20"
          } > "$RUNNER_TEMP/container.env"
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: replay

      - name: Build the image
        run: |
          set -euo pipefail
          # By digest: resolved from Docker Hub, the same digest from the mirror if need be.
          pulled="$(bash scripts/pull-base-image.sh)"
          read -r base digest <<<"$pulled"
          docker build --build-arg BASE_IMAGE="$base" --build-arg BASE_IMAGE_DIGEST="$digest" \
            --build-arg GIT_COMMIT_SHA="$GITHUB_SHA" -t "$IMAGE" .
          docker image inspect "$IMAGE" --format 'size {{.Size}} bytes, user {{.Config.User}}'

      - name: Run it (read-only, non-root) and wait until it is ready
        run: |
          set -euo pipefail
          # No AI credential goes into the image: it runs AI_PROVIDER=mock with no translation
          # key, and a real model's screening of the mock's output refuses it (422
          # content.rejected — Playform's identical job failed that way). The translation step is
          # proved on each deployment, with real providers, by the deploy smoke workflow.
          docker run -d --name app --network host --read-only \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=10001,gid=10001,mode=0700 \
            --env-file "$RUNNER_TEMP/container.env" "$IMAGE"
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "http://localhost:$PORT/api/health/ready"; then
              echo "ready after ${i}s"
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' app)" = "true" ] || break
            sleep 1
          done
          echo "the image did not become ready"
          curl -s "http://localhost:$PORT/api/health/ready" || true
          docker logs app
          exit 1

      - name: Runs as its non-root user
        run: |
          set -euo pipefail
          user="$(docker inspect -f '{{.Config.User}}' "$IMAGE")"
          [ "$user" = "10001:10001" ] || { echo "image user is '$user', not 10001:10001"; exit 1; }
          ids="$(docker exec app node -e 'process.stdout.write(`${process.getuid()}:${process.getgid()}`)')"
          [ "$ids" = "10001:10001" ] || { echo "the server runs as $ids"; exit 1; }
          echo "server process: uid:gid $ids"

      - name: Deploy smoke test against the image
        env:
          SMOKE_BASE_URL: http://localhost:3000
          SMOKE_EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_WAIT_SECONDS: "60"
          SMOKE_SKIP_TRANSLATE: "1"
        run: |
          set -euo pipefail
          echo "::notice::The image runs AI_PROVIDER=mock with no translation key, so the smoke test's translation step is skipped here; it is proved on each deployment by the deploy smoke workflow with real providers."
          node scripts/deploy-smoke.mjs

      - name: The job worker runs from the same image
        run: |
          set -euo pipefail
          docker run --rm --network host --read-only --no-healthcheck \
            --env-file "$RUNNER_TEMP/container.env" \
            -e JOBS_WORKER_URL="http://localhost:$PORT" -e JOBS_WORKER_ONCE=1 \
            "$IMAGE" node scripts/jobs-worker.mjs

      - name: Stops gracefully on SIGTERM
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker kill -s TERM app >/dev/null
          sleep 1
          ready=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT/api/health/ready")
          live=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT/api/health/live")
          echo "while draining: ready $ready, live $live"
          [ "$ready" = "503" ] && [ "$live" = "200" ] || { docker logs app; exit 1; }
          # A second signal joins the stop under way.
          docker kill -s TERM app >/dev/null
          code=$(timeout 30 docker wait app)
          elapsed=$(( $(date +%s) - start ))
          docker logs app 2>&1 | grep '^\[shutdown\]'
          echo "exit $code after ${elapsed}s"
          [ "$code" = "0" ] || exit 1
          docker logs app 2>&1 | grep -q '^\[shutdown\] database pools: done' || exit 1
          [ "$elapsed" -le 20 ] || { echo "the stop took longer than its bound"; exit 1; }

      - name: Container log
        if: failure()
        run: docker logs app 2>&1 | tail -n 200 || true
