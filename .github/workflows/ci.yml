name: Continuous Confidence

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Layer 0d — Dependency audit (TASK-058)
      # Production deps are the real runtime attack surface — audited strictly, hard gate.
      # Dev-only deps (jest/eslint/babel toolchain) are audited informationally: npm audit
      # evaluates declared manifest ranges rather than the resolved tree, so it false-positives
      # on transitives that `overrides` has already patched (e.g. brace-expansion pinned to a
      # fixed version). `npm ls` confirms the patched version is what installs; this step keeps
      # visibility without blocking CI on a range-vs-resolution false positive.
      - name: Layer 0d — Dependency audit (production, hard gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Layer 0d — Dependency audit (dev, informational)
        run: npm audit --audit-level=high || true

      - name: Layer 0a — Type check
        run: npm run typecheck

      - name: Layer 0b — Lint
        run: npm run lint

      - name: Layer 0c — Format check
        run: npm run format:check

      - name: Layer 0e — Override audit (TASK-070)
        run: npm run overrides:audit

      - name: Layer 1 — Unit tests
        run: npm run test:coverage

      - name: Layer 1b — Coverage ratchet (TASK-080)
        run: npm run coverage:ratchet

      - name: Layer 2 — Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  # Layer 1c — Migration replay (TASK-091)
  # Builds a database from zero the way a new instance is built — Supabase shim, schema
  # baseline, then every migration the baseline does not cover — on Postgres 17 with pgvector,
  # and fails on any SQL error, a missing table or function, or a table without row-level
  # security. Nothing else in CI executes migration SQL (Gotcha 100).
  migration-replay:
    name: Migration replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Replay baseline and newer migrations
        run: bash scripts/migration-replay.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: replay
