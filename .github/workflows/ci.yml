name: Continuous Confidence

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Layer 0d — Dependency audit (TASK-058)
      # Production deps are the real runtime attack surface — audited strictly, hard gate.
      # Dev-only deps (jest/eslint/babel toolchain) are audited informationally: npm audit
      # evaluates declared manifest ranges rather than the resolved tree, so it false-positives
      # on transitives that `overrides` has already patched (e.g. brace-expansion pinned to a
      # fixed version). `npm ls` confirms the patched version is what installs; this step keeps
      # visibility without blocking CI on a range-vs-resolution false positive.
      - name: Layer 0d — Dependency audit (production, hard gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Layer 0d — Dependency audit (dev, informational)
        run: npm audit --audit-level=high || true

      - name: Layer 0a — Type check
        run: npm run typecheck

      - name: Layer 0b — Lint
        run: npm run lint

      - name: Layer 0c — Format check
        run: npm run format:check

      - name: Layer 0e — Override audit (TASK-070)
        run: npm run overrides:audit

      - name: Layer 1 — Unit tests
        run: npm run test:coverage

      - name: Layer 1b — Coverage ratchet (TASK-080)
        run: npm run coverage:ratchet

      - name: Layer 2 — Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  # Layer 1c — Migration replay (TASK-091)
  # Builds a database from zero the way a new instance is built — Supabase shim, schema
  # baseline, then every migration the baseline does not cover — on Postgres 17 with pgvector,
  # and fails on any SQL error, a missing table or function, or a table without row-level
  # security. Nothing else in CI executes migration SQL (Gotcha 100).
  migration-replay:
    name: Migration replay
    runs-on: ubuntu-latest
    # Postgres 17 + pgvector from the PostgreSQL project's own apt repository, on the runner —
    # not a Docker Hub image: anonymous pulls are rate-limited, and the limit failed this job
    # twice in a row on 2026-10-09 with nothing wrong in the code (TASK-122).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Postgres 17 + pgvector (apt.postgresql.org)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgvector >/dev/null
          # apt normally starts the new cluster; start it only if it is not running.
          sudo pg_ctlcluster 17 main status >/dev/null || sudo pg_ctlcluster 17 main start
          # The runner image may already have another cluster on 5432; use whatever 17 got.
          port=$(pg_lsclusters --no-header | awk '$1 == 17 && $2 == "main" { print $3 }')
          [ -n "$port" ] || { pg_lsclusters; echo "no Postgres 17 cluster"; exit 1; }
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -q -p "$port" \
            -c "ALTER USER postgres PASSWORD 'postgres'" -c "CREATE DATABASE replay"
          echo "Postgres $(sudo -u postgres psql -X -At -p "$port" -c 'show server_version') on port $port"

      - name: Replay baseline and every migration it does not record
        run: bash scripts/migration-replay.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: replay
