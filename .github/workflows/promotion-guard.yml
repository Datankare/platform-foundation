name: Promotion Guard

# TASK-060: enforce the promotion path develop -> staging -> main. A pull request that merges
# develop (or any feature branch) directly into main skips staging and lands an unpromoted base,
# which is how develop came to trail main and a fix branch had to be cut from main. This guard
# fails any PR into main whose source is not an allowed promotion branch, so the path cannot be
# bypassed. For pull_request events GitHub runs the base branch's copy of this file, so the guard
# is active on main once a release promotion carries it there by the correct path.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

# Least privilege (audit H-5): read the code, nothing else.
permissions:
  contents: read

jobs:
  promotion-path:
    name: Promotion path into main
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-promotion sources
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR into main from: ${HEAD_REF}"
          case "${HEAD_REF}" in
            staging | promote/* | hotfix/*)
              echo "OK: '${HEAD_REF}' is an allowed promotion source into main."
              ;;
            develop)
              echo "::error::develop -> main is not allowed. Promote develop -> staging -> main."
              exit 1
              ;;
            *)
              echo "::error::'${HEAD_REF}' -> main is not an allowed promotion source. Use staging (promotion), promote/* (Route-B), or hotfix/*."
              exit 1
              ;;
          esac

      # Audit H-10: the name alone proved nothing — a fork's branch named "staging", or a
      # promote/* branch carrying code staging never had, passed. The source must be this
      # repository's own branch, and what it promotes must be what staging holds.
      - name: The source is this repository's own branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "::error::A promotion into main comes from this repository's own branches, not from ${HEAD_REPO}."
            exit 1
          fi

      - name: Checkout (history, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What is promoted is what staging holds
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging main
          case "${HEAD_REF}" in
            staging)
              # The PR's head is staging's tip: nothing was pushed past the promotion.
              if [ "$(git rev-parse origin/staging)" != "${HEAD_SHA}" ]; then
                echo "::error::The PR's head is not staging's tip."
                exit 1
              fi
              ;;
            promote/*)
              # Route B: a branch off main whose tree is staging's tree, exactly.
              if [ "$(git rev-parse "${HEAD_SHA}^{tree}")" != "$(git rev-parse "origin/staging^{tree}")" ]; then
                echo "::error::${HEAD_REF}'s tree differs from staging's: a Route-B promotion carries exactly what staging holds."
                exit 1
              fi
              ;;
            hotfix/*)
              # A hotfix is cut from main: main is an ancestor of its head.
              if ! git merge-base --is-ancestor origin/main "${HEAD_SHA}"; then
                echo "::error::${HEAD_REF} is not based on main's tip."
                exit 1
              fi
              ;;
          esac
          echo "OK: ${HEAD_REF} promotes what it should."
