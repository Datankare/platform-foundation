name: "Migration parity"

# Weekly, and on demand: does each live database have exactly this branch's migrations
# (scripts/migration-parity.mjs, audit X-24)? Credentials come from GitHub Environments named
# "staging" and "production", each with SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets.
# A repository without them (platform-foundation itself has no deployment) skips with a notice.
# Protect both Environments: limit each one's deployment branches to `main`. GitHub runs this
# workflow from the default branch (`main`) and the job then checks out the branch it compares,
# so a limit of `staging` would refuse the staging run. The service-role key must not be readable
# by a workflow dispatched from another branch; `main` takes changes only through reviewed PRs.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Migration parity (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            branch: staging
          - environment: production
            branch: main
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout the branch deployed to ${{ matrix.environment }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Compare
        # TASK-198 D-20: with MIGRATION_PARITY_REQUIRED set to 'true' (a repository variable), missing
        # credentials fail the check instead of skipping it.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_PARITY_REQUIRED: ${{ vars.MIGRATION_PARITY_REQUIRED }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            if [ "$MIGRATION_PARITY_REQUIRED" = "true" ]; then
              echo "::error::No ${{ matrix.environment }} database credentials in this repository, and MIGRATION_PARITY_REQUIRED is true."
              exit 1
            fi
            echo "::notice::No ${{ matrix.environment }} database credentials in this repository — skipped (MIGRATION_PARITY_REQUIRED is not true)."
            exit 0
          fi
          node scripts/migration-parity.mjs "${{ matrix.environment }}"
