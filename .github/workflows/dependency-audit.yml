name: Dependency Audit Sweep

# TASK-058: surface advisories proactively via a scheduled sweep, so they are not first seen when
# CI goes red on an unrelated push. Runs npm audit (production = hard gate, dev = informational)
# weekly and on demand. The "override the transitive, don't --force the framework" procedure and
# the override register live in docs/SECURITY_DEBT.md.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Least privilege (audit H-5): read the code, nothing else.
permissions:
  contents: read

jobs:
  audit:
    name: npm audit sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Audit (production, hard gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit (dev, informational)
        run: npm audit --audit-level=high || true

      - name: Override reaudit triage (TASK-070 / TASK-058)
        run: node scripts/override-reaudit.mjs >> "$GITHUB_STEP_SUMMARY"
