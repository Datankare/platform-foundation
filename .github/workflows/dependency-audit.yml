name: Dependency Audit Sweep

# TASK-058: surface advisories proactively via a scheduled sweep, so they are not first seen when
# CI goes red on an unrelated push. Runs npm audit (production = hard gate, dev = informational)
# weekly and on demand. The "override the transitive, don't --force the framework" procedure and
# the override register live in docs/SECURITY_DEBT.md.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: npm audit sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Audit (production, hard gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit (dev, informational)
        run: npm audit --audit-level=high || true

      - name: Override reaudit triage (TASK-070 / TASK-058)
        run: node scripts/override-reaudit.mjs >> "$GITHUB_STEP_SUMMARY"
