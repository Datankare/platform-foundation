version: 2

# Dependabot targets `develop`, not the default branch.
#
# Without this, Dependabot branches from `main` while every commit is authored on `develop`,
# so each bump is tested against a base that lags by however long since the last promotion.
# That is not hypothetical: Playform's eleven open PRs all failed Layer 3 on a fix that had
# been on develop for weeks, and clearing them took a promotion plus eleven recreate requests.
#
# The cost, stated: a bump landing on develop reaches production only at the next promotion,
# so a security fix is slower to deploy. Promotion here is frequent and manual, and that delay
# is smaller than the cost of every bump being tested against the wrong base.
updates:
  - package-ecosystem: "npm"
    target-branch: "develop"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Auto-merge patch updates via GitHub merge queue
    groups:
      patch-updates:
        update-types:
          - "patch"
    ignore:
      # ESLint 10: eslint-config-next 16.4's plugins (eslint-plugin-react 7.37, jsx-a11y 6.10,
      # import 2.32) declare peer eslint up to ^9, so npm installs them only by overriding their
      # peer range. Lift this when eslint-config-next's plugins declare eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node major we run (.nvmrc, CI, Vercel: 24); newer types would
      # type-check APIs the runtime does not have. Raise it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
